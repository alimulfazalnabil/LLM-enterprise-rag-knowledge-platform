name: ci
on:
  pull_request:
  push:
    branches: [ main ]
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          pip install -e ./backend
          pip install pytest httpx
      - name: Test
        run: pytest backend/tests -q
