[project]
name = "enterprise-rag-platform"
version = "0.1.0"
description = "Production-oriented multi-tenant RAG reference platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0.34",
  "alembic>=1.14.0"
]

[project.optional-dependencies]
test = ["pytest>=8.3", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
